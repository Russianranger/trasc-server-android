name: Build TAKP world and client launcher
on:
  push:
    branches: [codex/takp-world]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: takp-launcher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  takp-server:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Russianranger/Servertakp
          ref: 25bf70acb6bd24853cf09e447ddd62b96a4491a4
          path: runtime-work/takp-source
      - uses: actions/checkout@v4
        with:
          repository: Russianranger/queststakp
          ref: f43d4fcfa89fecd76b5ac3fb5096f8d658a6c65f
          path: runtime-work/takp-quests
      - uses: actions/checkout@v4
        with:
          repository: Russianranger/Mapstakp
          ref: 95cb9322b853e7ec2f67158b87442286315042eb
          path: runtime-work/takp-maps
      - name: Build the existing Bookworm dependency image for the isolated TAKP workspace
        run: docker build --platform linux/arm64 -t trasc-takp-qualification:1 runtime/traditional
      - name: Verify the production TAKP recipe, seed, accounts, server startup and client exports
        run: |
          set -o pipefail
          mkdir -p runtime-work/takp-work dist/takp
          docker run --rm --network none \
            -v "$PWD/backend:/opt/trasc:ro" \
            -v "$PWD/tests:/tests:ro" \
            -v "$PWD/runtime-work/takp-source:/source:ro" \
            -v "$PWD/runtime-work/takp-quests:/fixtures/quests:ro" \
            -v "$PWD/runtime-work/takp-maps:/fixtures/maps:ro" \
            -v "$PWD/runtime-work/takp-work:/work" \
            -v "$PWD/dist/takp:/evidence" \
            trasc-takp-qualification:1 bash -c '
              python3 - <<"PY"
          import json
          from pathlib import Path
          Path("/etc/trasc-runtime.json").write_text(json.dumps({"format":1,"architecture":"arm64","distribution":"debian-bookworm","profile":"takp","runtime":"takp-1.0","source_profile":"traditional","source_runtime":"traditional-1.0","build_adapter":1}) + "\n")
          PY
              python3 /tests/integration_takp_runtime.py --work /work --source /source --quests /fixtures/quests --maps /fixtures/maps --output /evidence/takp-runtime.json --jobs 2
            ' 2>&1 | tee dist/takp/qualification.log
      - name: Restore runner ownership of generated qualification evidence
        if: always()
        run: |
          # The disposable Docker fixture writes some logs/receipts as root with
          # mode 0600. Retain their modes while allowing the runner to upload them.
          task_ci_owner="$(id -u):$(id -g)"
          for directory in dist/takp runtime-work/takp-work/logs; do
            if [[ -d "$directory" ]]; then
              sudo chown -R --no-dereference "$task_ci_owner" "$directory"
            fi
          done
          shopt -s nullglob
          for receipt in runtime-work/takp-work/builds/*/CMakeCache.txt \
                         runtime-work/takp-work/builds/*/compile_commands.json \
                         runtime-work/takp-work/builds/*/*.ldd.txt \
                         runtime-work/takp-work/server/bin*/build-info.json; do
            sudo chown --no-dereference "$task_ci_owner" "$receipt" "$(dirname "$receipt")"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takp-bookworm-arm64-verification
          path: |
            dist/takp/
            runtime-work/takp-work/logs/
            runtime-work/takp-work/builds/*/CMakeCache.txt
            runtime-work/takp-work/builds/*/compile_commands.json
            runtime-work/takp-work/builds/*/*.ldd.txt
            runtime-work/takp-work/server/bin*/build-info.json
  modern-bots:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: traditional
            repository: Russianranger/Server
            revision: 4aceae18b94ffaafc08e2b17bc41cd72c77f795d
            source_dir: .
          - profile: custom
            repository: Russianranger/Triptych-Triumvirate
            revision: 8f6ca0795f424a7b4eab750ff38fc6473d48375c
            source_dir: Release-NMS-Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: runtime-work/bots-source
      - name: Fetch the exact Traditional websocket headers
        if: matrix.profile == 'traditional'
        run: git -C runtime-work/bots-source submodule update --init submodules/websocketpp
      - name: Build isolated native qualification dependencies
        run: |
          docker build --platform linux/arm64 -t trasc-bots-bookworm:1 runtime/traditional
          docker build --platform linux/arm64 -t trasc-bots-qualification:1 - <<'DOCKERFILE'
          FROM trasc-bots-bookworm:1
          RUN apt-get update && apt-get install -y --no-install-recommends liblua5.1-0-dev && apt-get clean && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
      - name: Add the debugger and verify original packages and tool bytes remain unchanged
        run: |
          docker build --platform linux/arm64 -t trasc-bots-diagnostics:1 - <<'DOCKERFILE'
          FROM trasc-bots-qualification:1
          RUN dpkg-query -W > /tmp/trasc-debugger-base-packages.txt && \
              sha256sum /usr/bin/gcc /usr/bin/g++ /usr/bin/cmake /usr/bin/ninja /usr/bin/perl > /tmp/trasc-debugger-base-tools.txt && \
              apt-get update && apt-get install -y --no-install-recommends --no-upgrade gdb && \
              sha256sum --check /tmp/trasc-debugger-base-tools.txt && \
              apt-get clean && rm -rf /var/lib/apt/lists/*
          RUN python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          before_text = Path('/tmp/trasc-debugger-base-packages.txt').read_text()
          after_text = subprocess.check_output(['dpkg-query', '-W']).decode()
          before = dict(line.split('\t', 1) for line in before_text.splitlines())
          after = dict(line.split('\t', 1) for line in after_text.splitlines())
          assert all(after.get(name) == version for name, version in before.items()), 'Debugger changed an existing package'
          proof = {'format': 1, 'existing_packages_unchanged': True,
                   'existing_tool_bytes_unchanged': True,
                   'base_packages_sha256': hashlib.sha256(before_text.encode()).hexdigest(),
                   'tools': Path('/tmp/trasc-debugger-base-tools.txt').read_text().splitlines(),
                   'debugger_version': subprocess.check_output(['gdb', '--version']).decode().splitlines()[0],
                   'added_packages': {name: version for name, version in after.items() if name not in before}}
          Path('/opt/trasc-debugger-layer.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
          DOCKERFILE
      - name: Fingerprint the actual native toolchain and qualified build recipe
        id: native-fingerprint
        run: |
          mkdir -p runtime-work
          docker run --rm --network none -i trasc-bots-qualification:1 python3 - > runtime-work/bots-toolchain.sha256 <<'PY'
          import hashlib, json, subprocess
          commands = [['dpkg-query', '-W'], ['gcc', '--version'], ['g++', '--version'],
                      ['cmake', '--version'], ['ninja', '--version'], ['perl', '-V']]
          values = [subprocess.check_output(command) for command in commands]
          print(hashlib.sha256(b'\0'.join(values)).hexdigest())
          PY
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import ast, hashlib
          from pathlib import Path
          tree = ast.parse(Path('tests/verify_modern_bot_bridge.py').read_text())
          names = {'build', 'command', 'sha', 'require', 'normalize_source_timestamps'}
          recipe = '\n'.join(ast.dump(node, include_attributes=False) for node in tree.body
                             if isinstance(node, ast.FunctionDef) and node.name in names)
          toolchain = Path('runtime-work/bots-toolchain.sha256').read_text().strip()
          print('sha=' + hashlib.sha256((toolchain + '\n' + recipe).encode()).hexdigest())
          PY
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: runtime-work/bots-work/native-build
          key: native-bots-build-v1-${{ matrix.profile }}-${{ matrix.revision }}-${{ steps.native-fingerprint.outputs.sha }}-${{ hashFiles('backend/modern_bot_bridge.py', 'backend/modern_bot_bridge.h', 'backend/server_ferry.py', 'backend/eq_server_ferry.h', 'backend/traditional_build.py', 'runtime/traditional/Dockerfile') }}
      - name: Fetch immutable PEQ fixture
        run: |
          mkdir -p runtime-work/bots-fixtures runtime-work/bots-work dist/bots
          curl --fail --location --retry 3 --max-time 120 https://db.eqemu.dev/api/v1/dump/archive/peq-1759046415.zip -o runtime-work/bots-fixtures/peq.zip
          echo 'ac8649f23d2c3aea2cade138dfe10d46d1b21ad1a80d08ca95f5434fab7f218d  runtime-work/bots-fixtures/peq.zip' | sha256sum --check
      - name: Compile and exercise actual native creation, hooks, limits, rollback and retry
        run: |
          set -o pipefail
          # The debugger layer verifies every base package and compiler/tool byte
          # above. It adds diagnostics without changing the keyed build recipe.
          docker run --rm --network none --cap-add SYS_PTRACE --security-opt seccomp=unconfined \
            -e TRASC_NATIVE_GDB_DIAGNOSTICS=1 \
            -v "$PWD/backend:/opt/trasc:ro" \
            -v "$PWD/tests:/tests:ro" \
            -v "$PWD/runtime-work/bots-source:/source:ro" \
            -v "$PWD/runtime-work/bots-fixtures:/fixtures:ro" \
            -v "$PWD/runtime-work/bots-work:/work" \
            -v "$PWD/dist/bots:/evidence" \
            trasc-bots-diagnostics:1 \
            python3 /tests/verify_modern_bot_bridge.py --source "/source/${{ matrix.source_dir }}" --profile "${{ matrix.profile }}" --work /work --database-zip /fixtures/peq.zip --output /evidence/native-bots.json --jobs 4 \
            2>&1 | tee dist/bots/qualification.log
      - name: Make disposable qualification evidence readable
        if: always()
        run: |
          task_ci_owner="$(id -u):$(id -g)"
          for directory in dist/bots runtime-work/bots-work/logs runtime-work/bots-work/fixture/logs runtime-work/bots-work/native-build; do
            if [[ -d "$directory" ]]; then
              sudo chown -R --no-dereference "$task_ci_owner" "$directory"
            fi
          done
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: runtime-work/bots-work/native-build
          key: native-bots-build-v1-${{ matrix.profile }}-${{ matrix.revision }}-${{ steps.native-fingerprint.outputs.sha }}-${{ hashFiles('backend/modern_bot_bridge.py', 'backend/modern_bot_bridge.h', 'backend/server_ferry.py', 'backend/eq_server_ferry.h', 'backend/traditional_build.py', 'runtime/traditional/Dockerfile') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-bots-${{ matrix.profile }}-arm64-verification
          path: |
            dist/bots/
            runtime-work/bots-work/logs/
            runtime-work/bots-work/fixture/logs/
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TRASC_PREVIEW_KEYSTORE: ${{ github.workspace }}/runtime-work/signing/preview.keystore
      ERARULES_MARIADB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache/restore@v4
        with:
          path: runtime-work/signing/preview.keystore
          key: trasc-preview-signing-v2
      - name: Require the existing installation signing key
        run: bash scripts/prepare-preview-signing.sh
      - uses: actions/cache/restore@v4
        id: baseline-cache
        with:
          path: runtime-work/baseline/
          key: takp-native-baseline-0.6.21-0047f5091b92b7417efc738ed056f221bb6c1d2cf9d63d4f3da00e7966c00b55
      - name: Fetch the immutable 0.6.21 release assets
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime-work/baseline dist
          gh api repos/Russianranger/trasc-server-android/releases/assets/627090614 -H 'Accept: application/octet-stream' > runtime-work/baseline/base.apk
          gh api repos/Russianranger/trasc-server-android/releases/assets/627090617 -H 'Accept: application/octet-stream' > runtime-work/baseline/launcher-sources.tar.gz
      - name: Reuse the exact published 0.6.21 native launcher payload
        run: |
          echo '76124578972ccf56159ad963fd52c48922fb42c29ef4618725802c6568375077  runtime-work/baseline/launcher-sources.tar.gz' | sha256sum --check
          python3 scripts/reuse-launcher-native.py extract --apk runtime-work/baseline/base.apk --receipt dist/native-reuse.json --expected-sha 0047f5091b92b7417efc738ed056f221bb6c1d2cf9d63d4f3da00e7966c00b55 --baseline-version 0.6.21 --include-camera
      - uses: actions/cache/save@v4
        if: steps.baseline-cache.outputs.cache-hit != 'true'
        with:
          path: runtime-work/baseline/
          key: takp-native-baseline-0.6.21-0047f5091b92b7417efc738ed056f221bb6c1d2cf9d63d4f3da00e7966c00b55
      - name: Install host regression dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-server binutils
          python3 -m pip install lupa
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify all Python, management JVM and launcher browser regressions
        run: bash scripts/check-takp-launcher.sh
      - name: Compile the launcher APK and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify signing, native reuse and TAKP client helpers
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > dist/apk-signing.txt
          python3 scripts/reuse-launcher-native.py verify --apk app/build/outputs/apk/debug/app-debug.apk --receipt dist/native-reuse.json
          python3 scripts/verify-takp-apk.py --apk app/build/outputs/apk/debug/app-debug.apk --signing-report dist/apk-signing.txt
      - name: Package launcher, preserved native sources and build manifest
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dist/trasc-server-android-preview.apk
          mkdir -p runtime-work/source-bundle/launcher-source
          cp runtime-work/baseline/launcher-sources.tar.gz runtime-work/source-bundle/launcher-source/native-sources-0.6.21.tar.gz
          git archive --format=tar.gz HEAD > runtime-work/source-bundle/launcher-source/launcher-code-0.6.22.tar.gz
          cp dist/native-reuse.json backend-assets/traditional-camera-bundle.json THIRD_PARTY_NOTICES.md runtime-work/source-bundle/launcher-source/
          tar -czf dist/launcher-sources.tar.gz -C runtime-work/source-bundle launcher-source
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('dist/trasc-server-android-preview.apk')
          manifest={'commit':os.environ['GITHUB_SHA'],'sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest(),
            'file':p.name,'version':'0.6.22','version_code':71,'application_id':'io.github.russianranger.trasc.preview',
            'signing_certificate_sha256':pathlib.Path('docs/preview-signing.sha256').read_text().strip(),
            'build_run':int(os.environ['GITHUB_RUN_ID']),'native_payload_reused_from':'0.6.21',
            'native_reuse_manifest_sha256':hashlib.sha256(pathlib.Path('dist/native-reuse.json').read_bytes()).hexdigest(),
            'traditional_camera_adapter_sha256':hashlib.sha256(pathlib.Path('backend-assets/trasc-camera-dinput8.dll').read_bytes()).hexdigest(),
            'source_archive_sha256':hashlib.file_digest(pathlib.Path('dist/launcher-sources.tar.gz').open('rb'),'sha256').hexdigest()}
          pathlib.Path('dist/preview-build.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: takp-launcher-release
          path: |
            dist/trasc-server-android-preview.apk
            dist/launcher-sources.tar.gz
            dist/preview-build.json
            dist/native-reuse.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takp-launcher-validation-reports
          path: |
            app/build/reports/
            ui-reports/
            dist/apk-signing.txt
  preview:
    needs: [apk, takp-server, modern-bots]
    if: github.ref == 'refs/heads/codex/takp-world'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: takp-launcher-release
          path: dist
      - name: Publish the validated TAKP launcher preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/preview" -f sha="$GITHUB_SHA" -F force=true
          gh release upload preview dist/trasc-server-android-preview.apk dist/launcher-sources.tar.gz dist/preview-build.json dist/native-reuse.json --clobber
          gh release edit preview --notes-file docs/preview-notes.md
