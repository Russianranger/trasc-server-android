name: Traditional server ARM64 investigation
on:
  push:
    branches: [codex/traditional-server-arm]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traditional-arm64-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  pch-memory:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pch-only]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Russianranger/Server
          ref: 4aceae18b94ffaafc08e2b17bc41cd72c77f795d
          path: traditional-pch-source
      - name: Fetch pinned websocket headers
        run: git -C traditional-pch-source submodule update --init --depth 1 submodules/websocketpp
      - name: Measure native ARM64 precompiled-header memory and size
        run: |
          set -o pipefail
          mkdir -p traditional-pch-evidence
          docker run --rm \
            -v "$PWD/traditional-pch-source:/source" \
            -v "$PWD/scripts:/probe:ro" \
            -v "$PWD/traditional-pch-evidence:/evidence" \
            debian:bookworm-slim bash -c '
              set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl git pkg-config cmake ninja-build build-essential libperl-dev python3 uuid-dev file time libboost-dev libcereal-dev rapidjson-dev libfmt-dev libglm-dev libluajit-5.1-dev librecast-dev libuv1-dev libmariadb-dev libssl-dev libsodium-dev zlib1g-dev
              python3 /probe/probe-traditional-system.py /source /probe/probe-traditional-system-dependencies.cmake /evidence/probe.patch
              cmake -S /source -B /evidence/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -fno-strict-aliasing" \
                -DEQEMU_USE_SYSTEM_DEPENDENCIES=ON \
                -DTRASC_WEBSOCKETPP_INCLUDE_DIR=/source/submodules/websocketpp \
                -DEQEMU_BUILD_PCH=ON \
                -DEQEMU_BUILD_SERVER=ON -DEQEMU_BUILD_LOGIN=ON \
                -DEQEMU_BUILD_CLIENT_FILES=ON -DEQEMU_BUILD_TESTS=OFF \
                -DEQEMU_BUILD_PERL=ON -DEQEMU_BUILD_LUA=ON \
                -DEQEMU_ADD_PROFILER=OFF 2>&1 | tee /evidence/configure.log
              /usr/bin/time -v -o /evidence/common-pch-resources.txt timeout 420 ninja -C /evidence/build -j1 common/CMakeFiles/common.dir/cmake_pch.hxx.gch 2>&1 | tee /evidence/common-pch.log
              /usr/bin/time -v -o /evidence/zone-pch-resources.txt timeout 420 ninja -C /evidence/build -j1 zone/CMakeFiles/zone.dir/cmake_pch.hxx.gch 2>&1 | tee /evidence/zone-pch.log
              find /evidence/build -name cmake_pch.hxx.gch -printf "%p %s bytes\n" > /evidence/pch-sizes.txt
            ' 2>&1 | tee traditional-pch-evidence/trial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traditional-server-arm64-pch-resources
          path: |
            traditional-pch-evidence/*.txt
            traditional-pch-evidence/*.log
            traditional-pch-evidence/*.patch
            traditional-pch-evidence/*.sha256
            traditional-pch-evidence/build/CMakeCache.txt
          retention-days: 14
  system-dependencies:
    if: ${{ !contains(github.event.head_commit.message, '[pch-only]') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Russianranger/Server
          ref: 4aceae18b94ffaafc08e2b17bc41cd72c77f795d
          path: traditional-system-source
      - name: Fetch only the pinned C++20-compatible websocket headers
        run: git -C traditional-system-source submodule update --init --depth 1 submodules/websocketpp
      - name: Compile with native Bookworm system packages
        run: |
          set -o pipefail
          mkdir -p traditional-system-evidence
          git -C traditional-system-source rev-parse HEAD > traditional-system-evidence/source.txt
          docker run --rm \
            -v "$PWD/traditional-system-source:/source" \
            -v "$PWD/scripts:/probe:ro" \
            -v "$PWD/traditional-system-evidence:/evidence" \
            debian:bookworm-slim bash -c '
              set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl git zip unzip tar pkg-config cmake ninja-build build-essential libperl-dev python3 uuid-dev file time libboost-dev libcereal-dev rapidjson-dev libfmt-dev libglm-dev libluajit-5.1-dev librecast-dev libuv1-dev libmariadb-dev libssl-dev libsodium-dev zlib1g-dev
              g++ --version > /evidence/compiler.txt
              cmake --version >> /evidence/compiler.txt
              dpkg-query -W > /evidence/packages.txt
              python3 /probe/probe-traditional-system.py /source /probe/probe-traditional-system-dependencies.cmake /evidence/probe.patch
              timeout 300 cmake -S /source -B /evidence/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -fno-strict-aliasing" \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DEQEMU_USE_SYSTEM_DEPENDENCIES=ON \
                -DTRASC_WEBSOCKETPP_INCLUDE_DIR=/source/submodules/websocketpp \
                -DEQEMU_BUILD_PCH=OFF \
                -DEQEMU_BUILD_SERVER=ON \
                -DEQEMU_BUILD_LOGIN=ON \
                -DEQEMU_BUILD_CLIENT_FILES=ON \
                -DEQEMU_BUILD_TESTS=OFF \
                -DEQEMU_BUILD_PERL=ON \
                -DEQEMU_BUILD_LUA=ON \
                -DEQEMU_ADD_PROFILER=OFF 2>&1 | tee /evidence/configure.log
              /usr/bin/time -v -o /evidence/build-resources.txt timeout 2700 cmake --build /evidence/build --parallel 2 \
                --target world zone shared_memory eqlaunch ucs queryserv loginserver export_client_files import_client_files -- -k0 2>&1 | tee /evidence/build.log
              file /evidence/build/bin/* > /evidence/binaries.txt
              ldd /evidence/build/bin/loginserver > /evidence/loginserver-ldd.txt
            ' 2>&1 | tee traditional-system-evidence/trial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traditional-server-arm64-system-dependencies
          path: |
            traditional-system-evidence/*.txt
            traditional-system-evidence/*.log
            traditional-system-evidence/*.patch
            traditional-system-evidence/*.sha256
            traditional-system-evidence/build/CMakeCache.txt
            traditional-system-evidence/build/compile_commands.json
            traditional-system-evidence/build/bin/
          retention-days: 14
  baseline:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'raw retry')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact selected server and recorded submodules
        uses: actions/checkout@v4
        with:
          repository: Russianranger/Server
          ref: 4aceae18b94ffaafc08e2b17bc41cd72c77f795d
          path: traditional-source
          submodules: recursive
      - name: Record source, compiler and available memory
        run: |
          mkdir -p traditional-evidence
          git -C traditional-source rev-parse HEAD > traditional-evidence/source.txt
          git -C traditional-source submodule status --recursive >> traditional-evidence/source.txt
          uname -a > traditional-evidence/host.txt
          free -h >> traditional-evidence/host.txt
      - name: Native ARM64 Debian Bookworm configure and compile trial
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD/traditional-source:/source" \
            -v "$PWD/traditional-evidence:/evidence" \
            -e VCPKG_MAX_CONCURRENCY=2 \
            -e VCPKG_FORCE_SYSTEM_BINARIES=1 \
            debian:bookworm-slim bash -c '
              set -euxo pipefail
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl git zip unzip tar pkg-config cmake ninja-build build-essential libperl-dev python3 uuid-dev file autoconf automake libtool libtool-bin
              g++ --version > /evidence/compiler.txt
              cmake --version >> /evidence/compiler.txt
              dpkg-query -W > /evidence/packages.txt
              cd /source
              ./submodules/vcpkg/bootstrap-vcpkg.sh -disableMetrics
              timeout 1500 cmake -S /source -B /evidence/build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG" \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DVCPKG_TARGET_TRIPLET=arm64-linux \
                -DVCPKG_HOST_TRIPLET=arm64-linux \
                -DEQEMU_BUILD_PCH=OFF \
                -DEQEMU_BUILD_SERVER=ON \
                -DEQEMU_BUILD_LOGIN=ON \
                -DEQEMU_BUILD_CLIENT_FILES=ON \
                -DEQEMU_BUILD_TESTS=OFF \
                -DEQEMU_BUILD_PERL=ON \
                -DEQEMU_BUILD_LUA=ON \
                -DEQEMU_ADD_PROFILER=OFF 2>&1 | tee /evidence/configure.log
              timeout 1800 cmake --build /evidence/build --parallel 2 \
                --target world zone shared_memory eqlaunch ucs queryserv loginserver export_client_files import_client_files 2>&1 | tee /evidence/build.log
              file /evidence/build/bin/* > /evidence/binaries.txt
            ' 2>&1 | tee traditional-evidence/trial.log
      - name: Retain native ARM64 trial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traditional-server-arm64-baseline
          path: |
            traditional-evidence/*.txt
            traditional-evidence/*.log
            traditional-evidence/build/CMakeCache.txt
            traditional-evidence/build/compile_commands.json
            traditional-evidence/build/vcpkg-manifest-install.log
            traditional-evidence/build/bin/
          retention-days: 14
