name: Build Turnip and DXVK
on:
  workflow_call:
  push:
    branches: [codex/turnip-stage]
permissions:
  contents: read
jobs:
  vulkan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-vulkan.sh
      - run: bash scripts/build-audio.sh
      - uses: actions/upload-artifact@v4
        with:
          name: client-vulkan
          path: |
            backend-assets/libasound_module_pcm_trasc.so
            backend-assets/audio-bundle.json
            backend-assets/turnip.so
            backend-assets/turnip-26.0.0.so
            backend-assets/vulkan-probe
            backend-assets/dxvk-d3d9.dll
            backend-assets/vulkan-bundle.json
            dist/vulkan-sources.tar.gz
