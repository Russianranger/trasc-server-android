name: Build Android preview
on:
  push:
    branches: [main, codex/client-bootstrap, codex/client-loader-fix, codex/client-performance, codex/client-texture-fix]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client-dll:
    uses: ./.github/workflows/client-dll.yml
  wined3d:
    uses: ./.github/workflows/wined3d.yml
  vulkan:
    uses: ./.github/workflows/vulkan.yml
  client-runtime:
    needs: [wined3d, vulkan]
    uses: ./.github/workflows/client-runtime.yml
    permissions:
      contents: write
      actions: read
  database:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download the published runtime and pinned server database
        run: |
          mkdir -p database-test/work database-test/fixtures
          curl --fail --location --retry 3 -o database-test/runtime-manifest.json https://github.com/Russianranger/trasc-server-android/releases/download/runtime-v1/runtime-manifest.json
          curl --fail --location --retry 3 -o database-test/runtime.tar.gz https://github.com/Russianranger/trasc-server-android/releases/download/runtime-v1/runtime-arm64.tar.gz
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('database-test')
          m=json.loads((p/'runtime-manifest.json').read_text())
          assert m['format']==1 and m['architecture']=='arm64'
          assert hashlib.file_digest((p/'runtime.tar.gz').open('rb'),'sha256').hexdigest()==m['sha256']
          PY
          docker import database-test/runtime.tar.gz trasc-database-test:1
          curl --fail --location --retry 3 -o database-test/fixtures/release-peq.zip https://raw.githubusercontent.com/Russianranger/Triptych-Triumvirate/18141ae0c9a11813733f08fa77db986951b853d6/Release-NMS-Server/database/release-peq.zip
          touch database-test/fixtures/hosts
          printf 'nameserver 192.0.2.1\noptions timeout:1 attempts:1\n' > database-test/fixtures/resolv.conf
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Back up and restore the full published Debian runtime with native archive code
        run: bash scripts/check-management.sh database-test/runtime.tar.gz
      - name: Reproduce Thor hostname failure and import the full seed offline
        run: |
          docker run --rm --network none --hostname localhost \
            -v "$PWD/database-test/fixtures/hosts:/etc/hosts:ro" \
            -v "$PWD/database-test/fixtures/resolv.conf:/etc/resolv.conf:ro" \
            -v "$PWD/database-test/fixtures:/fixtures:ro" \
            -v "$PWD/database-test/work:/work" \
            -v "$PWD/backend:/opt/trasc:ro" -v "$PWD/tests:/tests:ro" \
            trasc-database-test:1 python3 /tests/integration_database_offline.py --seed /fixtures/release-peq.zip
      - name: Verify rules, SQL, backup and restore offline
        run: |
          docker run --rm --network none --hostname localhost \
            -v "$PWD/database-test/fixtures/hosts:/etc/hosts:ro" \
            -v "$PWD/database-test/fixtures/resolv.conf:/etc/resolv.conf:ro" \
            -v "$PWD/backend:/opt/trasc:ro" -v "$PWD/tests:/tests:ro" \
            trasc-database-test:1 python3 /tests/integration_runtime.py
          docker run --rm --network none --hostname localhost \
            -v "$PWD/backend:/opt/trasc:ro" -v "$PWD/tests:/tests:ro" \
            trasc-database-test:1 python3 /tests/integration_players.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-import-verification
          path: |
            database-test/work/logs/
            database-test/work/database-verification.json
            database-test/runtime-manifest.json
  apk:
    needs: [wined3d, vulkan]
    runs-on: ubuntu-latest
    env:
      TRASC_PREVIEW_KEYSTORE: ${{ github.ref == 'refs/heads/main' && format('{0}/runtime-work/signing/preview.keystore', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-wined3d
      - uses: actions/download-artifact@v4
        with:
          name: client-vulkan
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reuse preview signing key between main builds
        id: preview-key
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: runtime-work/signing/preview.keystore
          key: trasc-preview-signing-v2
      - name: Prepare and verify the explicit preview signing key
        if: github.ref == 'refs/heads/main'
        run: bash scripts/prepare-preview-signing.sh
      - name: Persist the preview key before compiling
        if: github.ref == 'refs/heads/main' && steps.preview-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: runtime-work/signing/preview.keystore
          key: trasc-preview-signing-v2
      - name: Test control backend
        run: python3 -m unittest discover -s tests -v
      - name: Verify session archive and controller state on the host JVM
        run: bash scripts/check-management.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify management screens and validation flows
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/ui_management.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-ui-reports
          path: ui-reports/
      - name: Build packaged Android launcher
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config
          bash scripts/build-proot.sh
          bash scripts/build-cabextract.sh android
          bash scripts/build-virgl.sh android
      - name: Package corresponding launcher sources
        run: bash scripts/pack-launcher-sources.sh
      - name: Compile APK and check Android lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify the APK uses the preserved signing certificate
        if: github.ref == 'refs/heads/main'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > dist/apk-signing.txt
          python3 - <<'PY'
          import pathlib,re
          actual=re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-f]+)',pathlib.Path('dist/apk-signing.txt').read_text()).group(1)
          assert actual==pathlib.Path('dist/preview-signing.sha256').read_text().strip()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trasc-server-android-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/launcher-sources.tar.gz
            dist/preview-signing.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports/
  preview:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [apk, database, client-runtime, client-dll]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trasc-server-android-debug
          path: dist
      - name: Publish installable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/app/build/outputs/apk/debug/app-debug.apk dist/trasc-server-android-preview.apk
          if ! gh release view preview >/dev/null 2>&1; then
            gh release create preview --prerelease --title 'TRASC Android preview' --notes-file docs/preview-notes.md
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/preview" -f sha="$GITHUB_SHA" -F force=true
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('dist/trasc-server-android-preview.apk')
          import re
          version=re.search(r"versionName '([^']+)'",pathlib.Path('app/build.gradle').read_text()).group(1)
          signing=pathlib.Path('dist/dist/preview-signing.sha256').read_text().strip()
          pathlib.Path('dist/preview-build.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'file':p.name,'version':version,'application_id':'io.github.russianranger.trasc.preview','signing_certificate_sha256':signing},indent=2))
          PY
          gh release upload preview dist/trasc-server-android-preview.apk --clobber
          gh release upload preview dist/dist/launcher-sources.tar.gz --clobber
          gh release upload preview dist/preview-build.json --clobber
          gh release edit preview --notes-file docs/preview-notes.md
