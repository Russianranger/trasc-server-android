name: Export verified APK attachment
on:
  push:
    branches: [codex/apk-transfer-067]
permissions:
  contents: read
  actions: read
jobs:
  apk-attachment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trasc-server-android-debug
          run-id: 37258612072
          github-token: ${{ github.token }}
          path: signed-build
      - name: Record the signed APK checksum
        run: sha256sum signed-build/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: trasc-server-android-0.6.7-apk
          path: signed-build/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/download-artifact@v4
        with:
          name: management-ui-reports
          run-id: 37258612072
          github-token: ${{ github.token }}
          path: ui-previews
      - uses: actions/upload-artifact@v4
        with:
          name: content-import-067-previews
          path: |
            ui-previews/content-import-mobile.png
            ui-previews/ui-skin-traditional-mobile.png
            ui-previews/ui-skin-custom-thor.png
          retention-days: 14
