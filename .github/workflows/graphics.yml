name: Verify Android graphics bridge
on:
  push:
    branches: [codex/client-performance]
    paths: ['native/**', 'scripts/build-virgl.sh', '.github/workflows/graphics.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graphics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;27.2.12479018'
      - run: sudo apt-get update && sudo apt-get install -y meson ninja-build pkg-config
      - run: bash scripts/build-virgl.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: android-graphics-bridge
          path: app/src/main/jniLibs/arm64-v8a/libvirgl-server.so
  guest:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y meson ninja-build pkg-config libepoxy-dev libegl1-mesa-dev libgbm-dev libdrm-dev
      - run: bash scripts/build-virgl.sh host
      - name: Test the published guest Mesa through the native GLES bridge
        run: |
          mkdir -p runtime-work/gpu-test/tmp runtime-work/gpu-test/logs
          curl -fL --retry 3 https://github.com/Russianranger/trasc-server-android/releases/download/client-runtime-v1/client-runtime-arm64.tar.gz -o runtime-work/gpu-test/runtime.tar.gz
          docker import runtime-work/gpu-test/runtime.tar.gz trasc-gpu-test:1
          LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe runtime-work/native/virgl-host/out/vtest/virgl_test_server --use-egl-surfaceless --use-gles --multi-clients --socket-path "$PWD/runtime-work/gpu-test/tmp/.virgl_test" > runtime-work/gpu-test/logs/host.log 2>&1 &
          renderer=$!
          trap 'kill "$renderer" || true' EXIT
          for i in $(seq 1 100); do test -S runtime-work/gpu-test/tmp/.virgl_test && break; sleep .1; done
          docker run --rm --network none -v "$PWD/runtime-work/gpu-test/tmp:/tmp" -v "$PWD/runtime-work/gpu-test/logs:/logs" trasc-gpu-test:1 /bin/bash -c '
            export GALLIUM_DRIVER=virpipe LIBGL_ALWAYS_SOFTWARE=1 DISPLAY=:7
            Xtigervnc :7 -geometry 800x600 -depth 24 -rfbport -1 -nolisten tcp > /logs/display.log 2>&1 &
            for i in $(seq 1 100); do test -S /tmp/.X11-unix/X7 && break; sleep .1; done
            glxinfo -B > /logs/guest.log 2>&1
            cat /logs/guest.log
            grep -i "OpenGL renderer string: virgl" /logs/guest.log
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphics-bridge-diagnostics
          path: runtime-work/gpu-test/logs/
      - if: failure()
        run: cat runtime-work/gpu-test/logs/*.log
