name: Qualify TAKP published ARM64 camera path

on:
  push:
    branches: [codex/takp-camera-runtime-0627]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reuse immutable published client runtime and native input assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime-work/camera-arm64/assets dist/camera-arm64 dist/camera-observer
          gh api repos/Russianranger/trasc-server-android/releases/assets/617421976 > runtime-work/camera-arm64/runtime-asset.json
          gh api repos/Russianranger/trasc-server-android/releases/assets/635995342 > runtime-work/camera-arm64/apk-asset.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('runtime-work/camera-arm64')
          for name,asset,size,digest in (
              ('runtime',617421976,353710680,'2f130c07683e50bc606af111d5c35c4f503c1427772c1f9b0f45e1e4b75c76c4'),
              ('apk',635995342,18901782,'7bb7a902c5695a430e396ddd035703b4cce278c11896b371a98363090290fa85')):
              value=json.loads((root/(name+'-asset.json')).read_text())
              assert (value['id'],value['size'],value['digest'])==(asset,size,'sha256:'+digest),value
          PY
          gh api -H 'Accept: application/octet-stream' repos/Russianranger/trasc-server-android/releases/assets/617421976 > runtime-work/camera-arm64/runtime.tar.gz
          gh api -H 'Accept: application/octet-stream' repos/Russianranger/trasc-server-android/releases/assets/617422429 > runtime-work/camera-arm64/manifest.json
          gh api -H 'Accept: application/octet-stream' repos/Russianranger/trasc-server-android/releases/assets/635995342 > runtime-work/camera-arm64/baseline.apk
          python3 scripts/prepare-takp-camera-runtime.py \
            --runtime runtime-work/camera-arm64/runtime.tar.gz \
            --manifest runtime-work/camera-arm64/manifest.json \
            --apk runtime-work/camera-arm64/baseline.apk \
            --output runtime-work/camera-arm64/assets
          docker import runtime-work/camera-arm64/runtime.tar.gz trasc-camera-published:0626
      - name: Compile the open PE32 consumer and Bookworm observation tool only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-i686
          i686-w64-mingw32-g++ -std=c++14 -O2 -static -mwindows tests/takp_cursor_probe.cpp -o runtime-work/camera-arm64/cursor-probe.exe -ldinput8 -ldxguid
          docker build --platform linux/arm64 -f tests/takp_runtime_observer.Dockerfile -t trasc-camera-observer:0627 .
          container=$(docker create trasc-camera-observer:0627)
          docker cp "$container:/out/takp-xinput-observe" dist/camera-observer/takp-xinput-observe
          docker rm "$container"
          sha256sum dist/camera-observer/takp-xinput-observe > dist/camera-observer/takp-xinput-observe.sha256
          python3 - <<'PY'
          import hashlib,json,os,struct
          from pathlib import Path
          files=('native/presentation/takp-xinput-observe.c','native/presentation/observe-log.h','tests/takp_runtime_observer.Dockerfile')
          binary=Path('dist/camera-observer/takp-xinput-observe').read_bytes()
          assert binary[:6]==b'\x7fELF\x02\x01' and struct.unpack_from('<H',binary,18)[0]==183,'Observer must be native ARM64 ELF64'
          record={'format':1,'architecture':'arm64-glibc','distribution':'debian-bookworm','elf_machine':183,
              'compiler_flags':'gcc -std=c11 -O2 -Wall -Wextra -Werror -lX11 -ldl',
              'github_commit':os.environ['GITHUB_SHA'],'github_run_id':os.environ['GITHUB_RUN_ID'],
              'source_sha256':{name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files},
              'sha256':hashlib.sha256(binary).hexdigest(),'bytes':len(binary),
              'behavior':'read-only separate X connection; no XTest, warp, focus or grab',
              'marker':'TRASC_TAKP_XINPUT_OBSERVE_V1','bounded_output_bytes':131072,
              'maximum_seconds':300,'hard_timeout_seconds':301,'held_sample_ms':200,
              'idle_sample_ms':1000,'idle_byte_soft_limit':32768,
              'xi_client_requested':'2.2','runtime_libXi':'dlopen libXi.so.6'}
          Path('dist/camera-observer/observer-build.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          chmod +x tests/takp_box64_wine.py dist/camera-observer/takp-xinput-observe
      - name: Measure actual Box64, Bookworm TigerVNC and published TRASCIN1 input
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          docker run --rm --network none \
            -e GITHUB_SHA -e GITHUB_RUN_ID \
            -v "$PWD:/repo:ro" \
            -v "$PWD/runtime-work/camera-arm64/assets:/qualify/assets:ro" \
            -v "$PWD/runtime-work/camera-arm64/cursor-probe.exe:/qualify/cursor-probe.exe:ro" \
            -v "$PWD/dist/camera-observer/takp-xinput-observe:/qualify/observer:ro" \
            -v "$PWD/runtime-work/camera-arm64/assets/wineserver:/opt/wine/bin/wineserver:ro" \
            -v "$PWD/dist/camera-arm64:/out" \
            trasc-camera-published:0626 /usr/bin/python3 /repo/tests/integration_takp_runtime_cursor.py \
              --wine /repo/tests/takp_box64_wine.py --probe /qualify/cursor-probe.exe \
              --observer /qualify/observer --assets /qualify/assets --output /out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takp-published-arm64-camera-proof-0627
          path: |
            dist/camera-arm64/*.json
            dist/camera-arm64/*.log
            dist/camera-arm64/*/*.json
            dist/camera-arm64/*/*.log
            runtime-work/camera-arm64/assets/published-inputs.json
            runtime-work/camera-arm64/runtime-asset.json
            runtime-work/camera-arm64/apk-asset.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takp-bookworm-arm64-xinput-observer-0627
          path: dist/camera-observer/
          retention-days: 14

  native-host:
    # Reissue the existing proof with the updated optional observation support;
    # this does not rebuild or replace the qualified MSVC EQW helper.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install unchanged native-host cursor fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tigervnc-standalone-server g++-mingw-w64-i686 g++ libx11-dev libxtst-dev libx11-6 libxtst6 libxext6 libxrender1 libxrandr2 libxi6 libxfixes3 libxcursor1 libxinerama1 libxxf86vm1 libfontconfig1 libfreetype6 libasound2t64 libpulse0 libvulkan1
      - name: Fetch the pinned Wine 10 WoW64 fixture runtime
        run: |
          mkdir -p runtime-work/camera-host/wine dist/camera-host
          curl -fL --retry 3 -o runtime-work/camera-host/wine.tar.xz https://github.com/Kron4ek/Wine-Builds/releases/download/10.0/wine-10.0-amd64-wow64.tar.xz
          echo 'aeebbbf239e548f0136f1cd72a2e109dd9a572a8f703da3c09fa40d74d5c255f  runtime-work/camera-host/wine.tar.xz' | sha256sum --check
          tar -xJf runtime-work/camera-host/wine.tar.xz --strip-components=1 -C runtime-work/camera-host/wine
      - name: Verify the unchanged transport and DirectInput acceptance fixture
        run: |
          g++ -std=c++14 -O2 -Wall -Wextra -Werror tests/takp_camera_recenter.cpp -o runtime-work/camera-host/camera-unit
          runtime-work/camera-host/camera-unit
          i686-w64-mingw32-g++ -std=c++14 -O2 -static -mwindows tests/takp_cursor_probe.cpp -o runtime-work/camera-host/cursor-probe.exe -ldinput8 -ldxguid
          gcc -std=c11 -O2 -Wall -Wextra -Werror tests/takp_xinput_probe.c -o runtime-work/camera-host/xinput-probe -lX11 -lXtst
          python3 tests/integration_takp_cursor.py --wine "$PWD/runtime-work/camera-host/wine/bin/wine" --probe runtime-work/camera-host/cursor-probe.exe --input-probe runtime-work/camera-host/xinput-probe --output dist/camera-host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takp-native-host-cursor-proof-0627
          path: dist/camera-host/*.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: takp-native-host-cursor-receipt-0627
          path: dist/camera-host/cursor-verification.json
          retention-days: 14
