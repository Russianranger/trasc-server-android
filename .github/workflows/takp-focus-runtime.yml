name: Qualify TAKP scoped X focus recovery

on:
  push:
    branches: [codex/takp-focus-0630]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-arm64-focus:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact published runtime and native input bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime-work/focus/assets dist/focus-proof dist/focus-tools
          gh api repos/Russianranger/trasc-server-android/releases/assets/617421976 > runtime-work/focus/runtime-asset.json
          gh api repos/Russianranger/trasc-server-android/releases/assets/639098532 > runtime-work/focus/apk-asset.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('runtime-work/focus')
          for name,asset,size,digest in (
              ('runtime',617421976,353710680,'2f130c07683e50bc606af111d5c35c4f503c1427772c1f9b0f45e1e4b75c76c4'),
              ('apk',639098532,18952880,'e81e6afe2ac639a292d7c048cc7575a9cbd1af6a19f2cfe4a934f2c723e40fcf')):
              value=json.loads((root/(name+'-asset.json')).read_text())
              assert (value['id'],value['size'],value['digest'])==(asset,size,'sha256:'+digest),value
          PY
          gh api -H 'Accept: application/octet-stream' repos/Russianranger/trasc-server-android/releases/assets/617421976 > runtime-work/focus/runtime.tar.gz
          gh api -H 'Accept: application/octet-stream' repos/Russianranger/trasc-server-android/releases/assets/617422429 > runtime-work/focus/manifest.json
          gh api -H 'Accept: application/octet-stream' repos/Russianranger/trasc-server-android/releases/assets/639098532 > runtime-work/focus/baseline.apk
          python3 scripts/prepare-takp-focus-runtime.py \
            --runtime runtime-work/focus/runtime.tar.gz --manifest runtime-work/focus/manifest.json \
            --apk runtime-work/focus/baseline.apk --output runtime-work/focus/assets
          docker import runtime-work/focus/runtime.tar.gz trasc-focus-published:0629
      - name: Build open PE32 consumer and narrow Bookworm focus companion only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-i686
          i686-w64-mingw32-g++ -std=c++14 -O2 -static -mwindows tests/takp_focus_probe_0630.cpp -o runtime-work/focus/cursor-probe.exe -ldinput8 -ldxguid
          docker build --platform linux/arm64 -f tests/takp_focus_tools.Dockerfile -t trasc-focus-tools:0630 .
          container=$(docker create trasc-focus-tools:0630)
          docker cp "$container:/out/takp-xinput-focus" dist/focus-tools/takp-input-focus
          docker rm "$container"
          chmod +x tests/takp_box64_wine.py dist/focus-tools/takp-input-focus
          python3 - <<'PY'
          import hashlib,json,os,struct
          from pathlib import Path
          sources=('native/presentation/takp-xinput-focus.c','native/presentation/observe-log.h','tests/takp_focus_tools.Dockerfile')
          observer=Path('runtime-work/focus/assets/takp-xinput-observe').read_bytes()
          observer_receipt=json.loads(Path('runtime-work/focus/assets/takp-input-observer.json').read_text())
          assert hashlib.sha256(observer).hexdigest()==observer_receipt['sha256'] and len(observer)==observer_receipt['bytes'],'Preserved observer identity mismatch'
          assert observer==Path('backend/takp-input/takp-xinput-observe').read_bytes(),'Repository observer differs from actual published APK'
          p=Path('dist/focus-tools/takp-input-focus');binary=p.read_bytes()
          assert binary[:6]==b'\x7fELF\x02\x01' and struct.unpack_from('<H',binary,18)[0]==183,'Expected ARM64 ELF64'
          receipt={'format':1,'architecture':'arm64-glibc','distribution':'debian-bookworm',
              'marker':'TRASC_TAKP_X_FOCUS_RECOVERY_V2','sha256':hashlib.sha256(binary).hexdigest(),'bytes':len(binary),
              'window_titles':['EqW-TAKP','Client1'],'window_class':'eqgame.exe','bounded_output_bytes':131072,
              'github_commit':os.environ['GITHUB_SHA'],'github_run_id':os.environ['GITHUB_RUN_ID'],
              'source_sha256':{name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in sources},
              'compiler_flags':'gcc -std=c11 -O2 -Wall -Wextra -Werror -lX11',
              'scope':'Focus only exact visible game under pointer during physical RMB and None/PointerRoot; no warp/grab/registry writes'}
          p.with_name('takp-input-focus.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Reproduce wrong reversal and qualify repair plus refusal guards
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          docker run --rm --network none -e GITHUB_SHA -e GITHUB_RUN_ID \
            -v "$PWD:/repo:ro" -v "$PWD/runtime-work/focus/assets:/qualify/assets:ro" \
            -v "$PWD/runtime-work/focus/cursor-probe.exe:/qualify/cursor-probe.exe:ro" \
            -v "$PWD/dist/focus-tools:/qualify/tools:ro" \
            -v "$PWD/runtime-work/focus/assets/takp-xinput-observe:/qualify/takp-xinput-observe:ro" \
            -v "$PWD/runtime-work/focus/assets/wineserver:/opt/wine/bin/wineserver:ro" \
            -v "$PWD/dist/focus-proof:/out" \
            trasc-focus-published:0629 /usr/bin/python3 /repo/tests/integration_takp_focus.py \
              --wine /repo/tests/takp_box64_wine.py --probe /qualify/cursor-probe.exe \
              --observer /qualify/takp-xinput-observe --focus-helper /qualify/tools/takp-input-focus \
              --assets /qualify/assets --output /out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takp-published-arm64-focus-proof-0630
          path: |
            dist/focus-proof/*.json
            dist/focus-proof/*.log
            runtime-work/focus/assets/published-inputs.json
            runtime-work/focus/runtime-asset.json
            runtime-work/focus/apk-asset.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takp-bookworm-arm64-focus-tools-0630
          path: dist/focus-tools/
          retention-days: 14
