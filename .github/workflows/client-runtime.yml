name: Build embedded client runtime
on:
  workflow_call:
concurrency:
  group: client-runtime-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  client-runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Observe kernel SIGKILL senders during client tests
        run: bash scripts/client-exit-trace.sh start
      - uses: actions/download-artifact@v4
        with:
          name: client-wined3d
      - uses: actions/download-artifact@v4
        with:
          name: client-vulkan
      - run: cp backend-assets/libasound_module_pcm_trasc.so backend-assets/audio-bundle.json backend/
      - run: cp backend-assets/x11-frame-bridge backend-assets/presentation-bundle.json backend/ && chmod +x backend/x11-frame-bridge
      - run: cp backend-assets/wined3d-patch.json backend/
      - run: cp backend-assets/wineserver backend-assets/wineserver-patch.json backend/ && chmod +x backend/wineserver
      - run: cp backend-assets/turnip.so backend-assets/turnip-26.0.0.so backend-assets/vulkan-probe backend-assets/dxvk-d3d9.dll backend-assets/vulkan-bundle.json backend/ && chmod +x backend/vulkan-probe
      - uses: actions/cache/restore@v4
        id: client-image
        with:
          path: runtime-work/client-image.tar
          key: client-image-arm64-${{ hashFiles('client-runtime/Dockerfile') }}
      - name: Build isolated ARM64 Wine and display runtime
        run: bash scripts/build-client-runtime.sh
      - uses: actions/cache/save@v4
        if: steps.client-image.outputs.cache-hit != 'true'
        with:
          path: runtime-work/client-image.tar
          key: client-image-arm64-${{ hashFiles('client-runtime/Dockerfile') }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Microsoft DirectX helper installation
        run: bash scripts/check-directx.sh
      - name: Compile our own Windows 32-bit test program and DLL
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686
          mkdir -p runtime-work/client-test/client runtime-work/client-test/logs
          cc -shared -fPIC -O2 -Wall -Wextra -Werror tests/client_exit_delay.c -ldl -o runtime-work/client-test/client/exit-delay.so
          i686-w64-mingw32-gcc tests/client_probe.c -o runtime-work/client-test/client/eqgame.exe -mwindows -ld3d9
          i686-w64-mingw32-gcc tests/client_textures.c -o runtime-work/client-test/client/textures.exe -mwindows -ld3d9
          i686-w64-mingw32-gcc tests/client_audio.c -o runtime-work/client-test/client/audio.exe -lwinmm -ldsound -ldxguid -lm
          i686-w64-mingw32-gcc tests/client_models.c -o runtime-work/client-test/client/models.exe -mwindows -ld3d9
          i686-w64-mingw32-gcc tests/client_probe_dll.c -shared -o runtime-work/client-test/client/dinput8.dll -ldxguid
          python3 - <<'PYPE'
          import pathlib,struct
          p=pathlib.Path('runtime-work/client-test/client/eqgame.exe');data=bytearray(p.read_bytes())
          offset=struct.unpack_from('<I',data,0x3c)[0]
          flags=struct.unpack_from('<H',data,offset+22)[0]
          struct.pack_into('<H',data,offset+22,flags&~0x20) # Legacy non-large-address-aware PE32.
          p.write_bytes(data)
          print('Legacy PE32 image bytes:',struct.unpack_from('<I',data,offset+24+56)[0], 'large_address_aware:',False)
          PYPE
      - name: Verify real PE32 launch, native DLL, Direct3D9 and display input on ARM64
        run: |
          docker run --rm --network none \
            -v "$PWD/backend-assets/wined3d.dll:/opt/wine/lib/wine/i386-windows/wined3d.dll:ro" \
            -v "$PWD/backend:/opt/trasc-client:ro" -v "$PWD/tests:/tests:ro" \
            -v "$PWD/runtime-work/client-test/client:/client" \
            -v "$PWD/runtime-work/client-test/logs:/logs" \
            -v "$PWD/runtime-work/directx-test/output/directx:/directx:ro" \
            trasc-client:1 bash -c 'python3 /tests/wine_exit_grace.py && cp /opt/trasc-client/wineserver /opt/wine/bin/wineserver && python3 /tests/integration_client.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-runtime-verification
          path: |
            runtime-work/client-test/logs/
            runtime-work/client-test/client/probe-*.json
            runtime-work/client-test/client/probe-*.txt
            runtime-work/client-test/client/model-*.json
      - name: Show client diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('runtime-work/client-test/logs').glob('*'):
              print(p.name)
              print(p.read_text(errors='replace')[-18000:])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: client-runtime
          path: dist/client-runtime*
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Vulkan DXVK presentation, pixels, models and input directly and through PRoot
        run: bash scripts/check-client-vulkan.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-vulkan-verification
          path: |
            runtime-work/client-vulkan/logs/
            runtime-work/vulkan-proot/logs/
      - name: Show Vulkan diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for parent in ('runtime-work/client-vulkan/logs','runtime-work/vulkan-proot/logs'):
              for p in Path(parent).glob('*'):
                  if p.is_file(): print(p.name, p.read_text(errors='replace')[-14000:])
          PY
      - name: Verify client runtime installer and complete session roundtrip
        run: bash scripts/check-management.sh dist/client-runtime-arm64.tar.gz
      - name: Verify the installed runtime through pinned PRoot
        run: bash scripts/check-client-proot.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-proot-verification
          path: |
            runtime-work/client-proot/logs/
            runtime-work/client-proot/client/probe-*.json
            runtime-work/client-proot/client/probe-*.txt
            runtime-work/client-proot/client/model-*.json
      - name: Show PRoot client diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PYLOG'
          from pathlib import Path
          for p in Path('runtime-work/client-proot/logs').glob('*'):
              print(p.name)
              print(p.read_text(errors='replace')[-20000:])
          for parent in ('runtime-work/client-proot/root/opt/wine/lib/wine/i386-windows', 'runtime-work/client-proot/prefix/drive_c/windows/syswow64'):
              for name in ('ntdll.dll', 'kernel32.dll', 'kernelbase.dll', 'cmd.exe'):
                  p=Path(parent)/name
                  print(str(p), p.exists(), p.stat().st_size if p.exists() else 0)
          PYLOG
      - name: Build and verify the native GLES bridge lifecycle
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libepoxy-dev libegl1-mesa-dev libgbm-dev libdrm-dev
          bash scripts/build-virgl.sh host
          mkdir -p runtime-work/graphics-classes
          javac -d runtime-work/graphics-classes app/src/main/java/io/github/russianranger/trasc/GraphicsBridge.java tests/java/io/github/russianranger/trasc/GraphicsHostTest.java
          java -cp runtime-work/graphics-classes io.github.russianranger.trasc.GraphicsHostTest "$PWD/runtime-work/native/virgl-host/out/vtest/virgl_test_server"
      - name: Verify PE32 models, animation and movement through VirGL GLES
        run: bash scripts/check-client-graphics.sh
      - name: Verify VirGL GLES through the installed PRoot runtime
        run: bash scripts/check-client-proot.sh virgl
      - name: Collect kernel process-exit evidence
        if: always()
        run: bash scripts/client-exit-trace.sh collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-exit-trace
          path: runtime-work/exit-trace/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-graphics-verification
          path: |
            runtime-work/client-virgl/logs/
            runtime-work/client-virgl/client/probe-*.json
            runtime-work/client-virgl/client/model-*.json
            runtime-work/gpu-proot/logs/
            runtime-work/gpu-proot/client/probe-*.json
            runtime-work/gpu-proot/client/model-*.json
      - name: Show GLES diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for parent in ('runtime-work/client-virgl/logs','runtime-work/gpu-proot/logs'):
              for p in Path(parent).rglob('*'):
                  if not p.is_file(): continue
                  print(p.name)
                  print(p.read_text(errors='replace')[-18000:])
          PY
      - name: Publish separate online and offline client runtime
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view client-runtime-v1 >/dev/null 2>&1; then
            gh release create client-runtime-v1 --prerelease --title 'Embedded client runtime 1.0' --notes 'App-private ARM64 Debian, Wine 10.0 WoW64, Box64 0.4.4 and software graphics. No EverQuest files included. Native Windows DLL, Direct3D9, keyboard and mouse verified with an open test program; ROF2 device testing remains required.'
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/client-runtime-v1" -f sha="$GITHUB_SHA" -F force=true
          # Upload serially so each archive has its own bounded retry. Publish
          # the manifest last, after both payload and corresponding sources.
          for asset in dist/client-runtime-arm64.tar.gz dist/client-runtime-sources.tar.gz dist/client-runtime-manifest.json; do
            for attempt in 1 2; do
              echo "Uploading $asset (attempt $attempt/2)"
              if timeout --kill-after=15s 10m gh release upload client-runtime-v1 "$asset" --clobber; then
                break
              fi
              if [ "$attempt" -eq 2 ]; then
                echo "::error::Release asset upload failed: $asset"
                exit 1
              fi
              echo "::warning::Retrying interrupted release upload: $asset"
            done
          done
