    </linearGradient>
    <g id="bone" fill="url(#ivory)" stroke="#4e4032" stroke-width="1.1">
      <path d="M28 7C24 3 21 9 26 12C21 16 25 21 29 17C43 13 53 14 68 17C72 21 77 16 72 12C77 8 72 3 68 7C53 11 43 11 28 7Z"/>
      <path d="M31 11Q48 13 65 11" fill="none" stroke="#fff1d3" stroke-width=".7" opacity=".7"/>
