plugins { id 'com.android.application' }
android {
    namespace 'io.github.russianranger.trasc'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig {
        // Preserve early installations whose automatically generated signing key was lost.
        applicationId 'io.github.russianranger.trasc.preview'
        minSdk 26
        targetSdk 35
        versionCode 52
        versionName '0.6.3'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled false } }
    if (System.getenv('TRASC_PREVIEW_KEYSTORE')) {
        signingConfigs.debug {
            storeFile file(System.getenv('TRASC_PREVIEW_KEYSTORE'))
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so'] } }
    sourceSets { main { assets.srcDir '../backend-assets' } }
}
tasks.register('prepareBackend', Copy) {
    from('../backend') { include '*.py', '*.h', '*.lua' }
    from('../tools') { include 'pack-client-sdk.py' }
    into '../backend-assets'
}
tasks.named('preBuild').configure { dependsOn 'prepareBackend' }
