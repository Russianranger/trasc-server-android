plugins { id 'com.android.application' }
android {
    namespace 'io.github.russianranger.trasc'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.russianranger.trasc'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so'] } }
    sourceSets { main { assets.srcDir '../backend-assets' } }
}
tasks.register('prepareBackend', Copy) { from '../backend'; include 'engine.py'; into '../backend-assets' }
tasks.named('preBuild').configure { dependsOn 'prepareBackend' }
